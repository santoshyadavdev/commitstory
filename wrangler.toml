name = "commitstory"
main = "dist/yourstory/server/server.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Feature flag for story image generation endpoint.
# Set to "false" to disable /api/stories/generate-image.
ENABLE_STORY_IMAGE_GENERATION = "true"

[assets]
directory = "dist/yourstory/browser"
binding = "ASSETS"

# Add secrets via the Cloudflare dashboard or:
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GOOGLE_AI_API_KEY
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put GITHUB_CALLBACK_URL
