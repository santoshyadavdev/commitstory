name = "yourstory"
main = "dist/yourstory/server/server.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/yourstory/browser"
binding = "ASSETS"

[vars]
NODE_ENV = "production"

# Add your secrets via Cloudflare dashboard or `wrangler secret put`:
# SESSION_SECRET
# GOOGLE_AI_API_KEY
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
